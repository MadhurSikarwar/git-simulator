<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Git, from the inside out</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive Git lab for a skill session: learn the architecture, then run the whole workflow in a simulated repository with real object hashes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout concept: a lab bench. Three area colours carry meaning everywhere (working directory = amber,
   index = teal, repository = indigo). Git orange marks the one thing to press or the place HEAD is.
   Terminal stays dark in both themes. Hashes are shown as coloured squares so equal content looks equal. */
:root {
  --bg: #f1f4f8; --bg-2: #e8edf3; --surface: #ffffff; --surface-2: #f6f8fb;
  --line: #d2dae4; --line-2: #e3e8ef;
  --ink: #16202c; --ink-2: #435063; --ink-3: #66748a;
  --accent: #d2401b; --accent-ink: #ffffff; --accent-soft: #fde9e2; --accent-line: #f0b3a2;
  --wd: #94500a; --wd-bg: #fff2dc; --wd-line: #ecc98d;
  --idx: #05746b; --idx-bg: #dcf3ef; --idx-line: #93d3ca;
  --repo: #3946b5; --repo-bg: #e7eafb; --repo-line: #b2baee;
  --good: #137538; --good-bg: #e1f4e7; --bad: #b8232d; --bad-bg: #fce6e7; --warn: #86560a; --warn-bg: #fff3cf;
  --term-bg: #0c1117; --term-fg: #d6dde7; --term-dim: #7a8799; --term-line: #1d2732;
  --t-red: #ff7b72; --t-green: #7ee787; --t-yellow: #e3b341; --t-blue: #79c0ff; --t-magenta: #d2a8ff; --t-cyan: #56d4dd;
  --shadow: 0 1px 2px rgba(18, 30, 46, .06), 0 6px 20px rgba(18, 30, 46, .06);
  color-scheme: light;
  --font-display: "Bricolage Grotesque", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}
:root[data-site-theme="dark"] {
  --bg: #0c1117; --bg-2: #111820; --surface: #151d27; --surface-2: #1a2430;
  --line: #2a3747; --line-2: #212c3a;
  --ink: #e4eaf1; --ink-2: #aab6c6; --ink-3: #8794a7;
  --accent: #f26238; --accent-ink: #1b0a04; --accent-soft: #3a1c13; --accent-line: #7a3524;
  --wd: #f0b45e; --wd-bg: #2a2012; --wd-line: #5b4320; --idx: #55d4c8; --idx-bg: #112a28; --idx-line: #23595a;
  --repo: #94a0ff; --repo-bg: #1a1f3e; --repo-line: #333e7c;
  --good: #62d68b; --good-bg: #12291c; --bad: #ff7f88; --bad-bg: #2e1619; --warn: #f1c25c; --warn-bg: #2c2410;
  --term-bg: #080c11; --term-fg: #d6dde7; --term-dim: #7a8799; --term-line: #1a232d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

/* ---------------------------------------------------------------- base */
[hidden] { display: none !important; }
html { font-size: 16px; scroll-padding-top: 72px; }
html.proj { font-size: 19px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
*, *::before, *::after { box-sizing: border-box; }
h1, h2, h3, h4, h5 { font-family: var(--font-display); margin: 0; line-height: 1.12; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0 0 .9rem; }
a { color: var(--repo); }
code, pre, kbd { font-family: var(--font-mono); }
code { font-size: .86em; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 5px; padding: .08em .35em; color: var(--ink); overflow-wrap: anywhere; }
pre code, .codeblock code { background: none; border: 0; padding: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
input, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-ink); padding: .5rem .8rem; border-radius: 6px; z-index: 200; }
.skip:focus { left: 8px; }
.mini { font-size: .8rem; color: var(--ink-3); }
.grow { flex: 1; }
.eyebrow { font: 600 .74rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 .7rem; }
.lede { font-size: 1.12rem; color: var(--ink-2); max-width: 62ch; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-head { padding-block: 2.4rem 1.2rem; }
.page-head h2 { font-size: clamp(1.9rem, 4vw, 2.8rem); font-weight: 800; margin-bottom: .6rem; }
.page { min-height: 70vh; }

/* ---------------------------------------------------------------- buttons, chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 9px; padding: .5rem .9rem; font-weight: 500; font-size: .9rem; text-decoration: none; line-height: 1.2; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); border-color: var(--accent); }
.btn.warn { color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.lg { padding: .75rem 1.25rem; font-size: 1rem; border-radius: 11px; }
.btn.pulse { animation: pulse 1.8s ease-in-out 3; }
.mini-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: .22rem .55rem; font-size: .76rem; color: var(--ink-2); }
.mini-btn:hover { border-color: var(--ink-3); color: var(--ink); }
.linkbtn { background: none; border: 0; color: var(--repo); text-decoration: underline; padding: 0; font-size: .86rem; }
.chip { display: inline-block; font: 600 .66rem/1 var(--font-mono); padding: .2rem .4rem; border-radius: 5px; background: var(--surface-2); color: var(--ink-3); letter-spacing: .02em; white-space: nowrap; }
.chip.unt { background: var(--bad-bg); color: var(--bad); }
.chip.mod { background: var(--warn-bg); color: var(--warn); }
.chip.stg { background: var(--good-bg); color: var(--good); }
.chip.del, .chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.ign { background: var(--surface-2); color: var(--ink-3); }
.chip.same { background: var(--surface-2); color: var(--ink-3); }
.chip.t-blob { background: var(--wd-bg); color: var(--wd); } .chip.t-tree { background: var(--idx-bg); color: var(--idx); }
.chip.t-commit { background: var(--repo-bg); color: var(--repo); } .chip.t-tag { background: var(--warn-bg); color: var(--warn); }
.badge { font: 600 .68rem/1 var(--font-body); padding: .25rem .5rem; border-radius: 99px; letter-spacing: .04em; text-transform: uppercase; }
.badge.ok { background: var(--good-bg); color: var(--good); } .badge.bad { background: var(--bad-bg); color: var(--bad); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); vertical-align: -1px; margin-right: .3rem; }
.sw.ghost { background: transparent; box-shadow: none; border: 1px dashed var(--ink-3); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); min-width: 0; }
.panel-h { padding: .85rem 1.1rem .5rem; display: flex; align-items: baseline; gap: .8rem; flex-wrap: wrap; }
.panel-h h2, .panel-h h3 { font-size: 1.05rem; font-weight: 700; }
.panel-sub { margin: 0; font-size: .82rem; color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: .55rem 1rem; border-radius: 99px; font-size: .88rem; opacity: 0; pointer-events: none; transition: .25s; z-index: 300; max-width: 90vw; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------------------------------------------------------------- nav + footer */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav-in { max-width: 1560px; margin-inline: auto; display: flex; align-items: center; gap: 1rem; min-height: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.nav-brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; color: var(--ink); font: 700 1rem var(--font-display); white-space: nowrap; }
.nav-links { display: flex; gap: .15rem; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav-links a { color: var(--ink-2); text-decoration: none; padding: .45rem .75rem; border-radius: 8px; font-size: .92rem; font-weight: 500; white-space: nowrap; position: relative; }
.nav-links a:hover { background: var(--bg-2); color: var(--ink); }
.nav-links a.on { color: var(--ink); background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
.nav-badge { font: 600 .66rem/1 var(--font-mono); background: var(--bg-2); color: var(--ink-3); border-radius: 99px; padding: .18rem .4rem; margin-left: .2rem; }
.nav-badge.some { background: var(--accent-soft); color: var(--accent); }
.nav-proj { font-size: .8rem; padding: .35rem .65rem; }
.nav-proj[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.site-foot { border-top: 1px solid var(--line); margin-top: 3rem; padding-block: 1.5rem 2rem; color: var(--ink-3); font-size: .85rem; }
.site-foot p { margin: 0 0 .3rem; }

/* ---------------------------------------------------------------- callouts, tables, misc content */
.callout { display: grid; grid-template-columns: 6.2rem 1fr; gap: .9rem; padding: .9rem 1.1rem; border-radius: 12px; border: 1px solid; margin: 1.3rem 0; max-width: 74ch; }
.callout p { margin: 0 0 .5rem; } .callout p:last-child { margin: 0; }
.co-l { font: 700 .68rem/1.5 var(--font-body); letter-spacing: .12em; text-transform: uppercase; padding-top: .15rem; }
.callout.say { background: var(--idx-bg); border-color: var(--idx-line); } .callout.say .co-l { color: var(--idx); }
.callout.watch { background: var(--warn-bg); border-color: var(--warn); } .callout.watch .co-l { color: var(--warn); }
.callout.gist { background: var(--accent-soft); border-color: var(--accent-line); } .callout.gist .co-l { color: var(--accent); }
.tbl-wrap { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: .88rem; }
.tbl th { text-align: left; font: 600 .7rem/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: .65rem .85rem; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: .6rem .85rem; border-bottom: 1px solid var(--line-2); vertical-align: top; min-width: 7rem; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.safe td:first-child { box-shadow: inset 3px 0 var(--good); } .tbl tr.risk td:first-child { box-shadow: inset 3px 0 var(--bad); }
.tbl code.pre { white-space: pre; }
.codeblock { background: var(--term-bg); color: var(--term-fg); border-radius: 10px; padding: .9rem 1rem; font-size: .84rem; overflow-x: auto; max-width: 74ch; line-height: 1.5; }
.qlist { padding-left: 1.2rem; max-width: 68ch; } .qlist li { margin-bottom: .35rem; }

/* animation helpers */
@keyframes flash { 0% { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-line); } 100% { background: transparent; box-shadow: 0 0 0 0 transparent; } }
@keyframes pop { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.15); opacity: 1; } 100% { transform: scale(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-line); } 50% { box-shadow: 0 0 0 7px transparent; } }
@keyframes travel { 0% { left: 0; opacity: 1; } 100% { left: calc(100% - 8px); opacity: .1; } }
@keyframes travelb { 0% { left: calc(100% - 8px); opacity: 1; } 100% { left: 0; opacity: .1; } }
.fresh { animation: flash 1.6s ease-out; }
li.row.fresh, .snap.fresh, .ref-row.fresh, .objlist li.fresh, .file.fresh, .wf-list li.fresh, .wf-log li.fresh { animation: flash 1.6s ease-out; }
.g-node.fresh { animation: pop .55s ease-out; transform-box: fill-box; transform-origin: center; }
.g-pill.fresh { animation: pop .55s ease-out; transform-box: fill-box; transform-origin: center; }
.g-edge.fresh { animation: fadein .6s ease-out; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

/* ---------------------------------------------------------------- home */
.hero { max-width: 1280px; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(1.5rem, 4vw, 3.5rem); align-items: center; padding: clamp(2rem, 5vw, 4.2rem) max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero h1 { font-size: clamp(2.5rem, 5.6vw, 4.6rem); font-weight: 800; line-height: .98; letter-spacing: -.03em; margin-bottom: 1.1rem; }
.cta { display: flex; gap: .7rem; flex-wrap: wrap; margin: 1.5rem 0 1.1rem; }
.hero-facts { display: flex; gap: 1.4rem; flex-wrap: wrap; font-size: .85rem; color: var(--ink-3); margin: 0; }
.hero-facts span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: .45rem; vertical-align: 1px; }
.resume { margin-top: 1rem; padding: .7rem .9rem; border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: 10px; font-size: .9rem; }
.hero-fig { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 1rem; box-shadow: var(--shadow); background-image: linear-gradient(var(--line-2) 1px, transparent 1px), linear-gradient(90deg, var(--line-2) 1px, transparent 1px); background-size: 22px 22px; background-position: -1px -1px; min-width: 0; }
.hero-fig figcaption { font-size: .8rem; color: var(--ink-3); margin-top: .7rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.hero-cmd { display: inline-flex; align-items: center; gap: .5rem; background: var(--term-bg); color: var(--term-fg); font: .85rem var(--font-mono); padding: .45rem .8rem; border-radius: 99px; margin-bottom: .8rem; }
.hero-cmd .hc-p { color: var(--t-green); } .hero-cmd code { background: none; border: 0; color: inherit; padding: 0; }
.hero-demo .area { background: var(--surface); }
.band { padding-block: clamp(2.2rem, 5vw, 3.6rem); border-top: 1px solid var(--line); }
.band:nth-of-type(odd) { background: var(--bg-2); }
.band h2 { font-size: clamp(1.6rem, 3vw, 2.3rem); font-weight: 800; margin-bottom: 1.4rem; max-width: 22ch; }
.idea-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.2rem; display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.idea h3 { font-size: 1.2rem; font-weight: 700; }
.idea-n { font: 800 2.2rem/1 var(--font-display); color: var(--accent); }
.idea .more { margin-top: auto; font-size: .88rem; }
.path-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: .8rem; }
.path { display: flex; flex-direction: column; gap: .35rem; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem; text-decoration: none; color: var(--ink); transition: transform .15s, border-color .15s; }
.path:hover { transform: translateY(-2px); border-color: var(--ink-3); }
.path b { font: 700 1.2rem var(--font-display); } .path span { color: var(--ink-2); font-size: .9rem; } .path i { margin-top: auto; padding-top: .6rem; font-style: normal; font-weight: 600; font-size: .85rem; color: var(--accent); }
.path.main { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.timeline { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
.timeline li { flex: var(--w) 1 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--repo); border-radius: 8px; padding: .6rem .7rem; display: flex; flex-direction: column; gap: .2rem; }
.timeline li:nth-child(odd) { border-top-color: var(--idx); } .timeline li:nth-child(3n) { border-top-color: var(--wd); }
.tl-t { font: 600 .7rem var(--font-mono); color: var(--ink-3); } .timeline b { font-size: .85rem; line-height: 1.2; } .tl-d { font-size: .75rem; color: var(--ink-3); }

/* ---------------------------------------------------------------- areas view */
.areas-view { padding: .3rem .9rem .9rem; }
.areas-grid { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr) 64px minmax(0, 1fr); align-items: stretch; }
.area { --c: var(--wd); --cb: var(--wd-bg); --cl: var(--wd-line); border: 1px solid var(--cl); border-top: 3px solid var(--c); border-radius: 10px; background: var(--surface); display: flex; flex-direction: column; min-width: 0; min-height: 170px; transition: opacity .3s; }
.area.idx { --c: var(--idx); --cb: var(--idx-bg); --cl: var(--idx-line); } .area.repo { --c: var(--repo); --cb: var(--repo-bg); --cl: var(--repo-line); }
.area-h { padding: .6rem .75rem .5rem; background: var(--cb); border-radius: 7px 7px 0 0; }
.area-h h3 { font-size: .98rem; font-weight: 700; color: var(--c); } .area-h h3 small { font: 500 .7rem var(--font-body); opacity: .8; }
.area-h p, .area-h em { margin: 0; display: block; font-size: .7rem; line-height: 1.35; color: var(--ink-2); font-style: normal; } .area-h em { color: var(--ink-3); font-style: italic; }
.rows { list-style: none; margin: 0; padding: 0; flex: 1; }
.row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: .45rem; align-items: center; padding: .3rem .65rem; font: .76rem var(--font-mono); border-top: 1px solid var(--line-2); }
.row .sw { margin: 0; }
.row .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); font: inherit; }
button.fname { cursor: pointer; text-decoration: underline dotted var(--ink-3); text-underline-offset: 3px; }
button.fname:hover { color: var(--accent); }
.row .hx { background: none; border: 0; padding: 0; color: var(--ink-3); font-size: .7rem; }
.row.unt .fname { color: var(--bad); } .row.mod .fname { color: var(--warn); } .row.ign { opacity: .55; } .row.bad .fname { color: var(--bad); font-weight: 700; }
.row.del { opacity: .75; } .row.del .fname { text-decoration: line-through; }
li.empty { padding: .8rem; font: .78rem/1.5 var(--font-body); color: var(--ink-3); }
li.headline { padding: .45rem .65rem; font-size: .76rem; border-bottom: 1px solid var(--line-2); display: flex; flex-wrap: wrap; gap: .35rem; align-items: baseline; }
li.headline b { color: var(--repo); font-family: var(--font-mono); } li.headline .msg { color: var(--ink-2); flex-basis: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.area-f { padding: .35rem .65rem; border-top: 1px solid var(--line-2); font: .68rem var(--font-mono); color: var(--ink-3); min-height: 1.9rem; }
.no-repo .area.idx, .no-repo .area.repo { opacity: .5; }
.gutter { display: flex; flex-direction: column; justify-content: center; gap: 1.1rem; padding: 0 5px; }
.arrow { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 500 .6rem/1.2 var(--font-mono); color: var(--ink-3); text-align: center; }
.arrow .ln { display: block; width: 100%; height: 2px; background: var(--line); position: relative; border-radius: 2px; }
.arrow.f .ln::after, .arrow.b .ln::after { content: ""; position: absolute; top: -4px; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.arrow.f .ln::after { right: -2px; border-left: 8px solid var(--line); } .arrow.b .ln::after { left: -2px; border-right: 8px solid var(--line); }
.arrow.lit .lbl { color: var(--accent); font-weight: 700; } .arrow.lit .ln { background: var(--accent); }
.arrow.lit.f .ln::after { border-left-color: var(--accent); } .arrow.lit.b .ln::after { border-right-color: var(--accent); }
.arrow.lit .ln::before { content: ""; position: absolute; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.arrow.lit.f .ln::before { animation: travel 1.1s ease-out; } .arrow.lit.b .ln::before { animation: travelb 1.1s ease-out; }
.preview-bar { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-top: .7rem; }
.preview { margin-top: .6rem; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }

/* ---------------------------------------------------------------- lab */

/* Git Simulator: engine.

/* ---------------------------------------------------------------- restore / reset / clean */

/* ---------------------------------------------------------------- plumbing-ish inspection */

G['cat-file'] = (sim, args, ctx) => {

/* ---------------------------------------------------------------- branches, checkout, switch */
const validBranch = n => n && !/[\s~^:?*[\\]|\.\.|^-|\/$|\.lock$|^@$|@\{/.test(n);

G.branch = (sim, args, ctx) => {

    for (const n of names) {
      const ref = 'refs/heads/' + n;
      if (!g.refs[ref]) { out.push("error: branch '" + n + "' not found."); continue; }
      if (g.head.ref === ref) { out.push("error: cannot delete branch '" + n + "' used by worktree at '" + sim.cwdLabel + "'"); continue; }
      if (o.f.d && !sim.ancestors(sim.headHash()).has(g.refs[ref])) { out.push("error: the branch '" + n + "' is not fully merged.\nhint: If you are sure you want to delete it, run 'git branch -D " + n + "'"); continue; }

    sim.op('update-ref', 'refs/heads/' + name + ' → ' + short(from) + ' (a new 41-byte file; no files were copied)', 'ref', from);
    ctx.r.flow = ['branch'];
    ctx.r.explain = 'git branch ' + name + ' created one tiny file, .git/refs/heads/' + name + ', containing the hash of the commit you are on. HEAD did not move, so you are still on ' + (sim.branchName() || 'the same commit') + '. That is why branches are free in Git.';

  }

  if (!g.head.ref) lines.push(A.g + '* (HEAD detached at ' + short(g.head.hash) + ')' + A.x);
  for (const b of sim.branches()) {
    const cur = g.head.ref === 'refs/heads/' + b;
    const h = g.refs['refs/heads/' + b];
    const txt = o.f.v ? ' ' + short(h) + ' ' + subject(sim, h) : '';
    lines.push(cur ? A.g + '* ' + b + A.x + txt : '  ' + b + txt);
  }
  ctx.r.explain = 'git branch with no name lists the files in .git/refs/heads/. The star marks the branch HEAD points to.';

};

function switchTo(sim, targetHash, headSpec, opts, ctx) {
  const g = sim.git();

  const from = sim.branchName() || short(sim.headHash());
  const changed = sim.applyTree(cur, tgt);
  const fromHash = sim.headHash();
  if (headSpec.ref) g.head = { ref: headSpec.ref }; else g.head = { hash: headSpec.hash };
  sim.logReflog(targetHash, 'checkout: moving from ' + from + ' to ' + (headSpec.ref ? headSpec.ref.replace('refs/heads/', '') : short(headSpec.hash)));

  if (!changed.length) sim.op('checkout', 'working files already matched; nothing rewritten', 'worktree');

  const head2 = sim.headFlat();
  for (const p of Object.keys(g.index).sort()) { if (!head2[p] || head2[p].hash !== g.index[p].hash) carried.push('A\t' + p); else if (sim.wtHash(p) !== g.index[p].hash) carried.push('M\t' + p); }

}
const DETACHED_ADVICE = (h) => "Note: switching to '" + h + "'.\n\nYou are in 'detached HEAD' state. You can look around, make experimental\nchanges and commit them, and you can discard any commits you make in this\nstate without impacting any branches by switching back to a branch.\n\nIf you want to create a new branch to retain commits you create, you may\ndo so (now or later) by using -c with the switch command. Example:\n\n  git switch -c <new-branch-name>\n\nOr undo this operation with:\n\n  git switch -\n\nTurn off this advice by setting config variable advice.detachedHead to false\n";

function restorePaths(sim, source, specs, ctx) {
  const g = sim.git();
  const srcFlat = source ? sim.commitFlat(source) : g.index;
  const known = Object.keys(srcFlat);
  const errs = [], all = new Set();
  for (const s of specs) { const m = specMatcher(s); const hits = known.filter(m); if (!hits.length) errs.push(pathErr(s)); hits.forEach(h => all.add(h)); }
  if (errs.length) throw new GitError(errs.join('\n'), { code: 'pathspec' });
  for (const p of all) {
    const e = srcFlat[p];
    sim.s.fs[p] = sim.blobContent(e.hash);
    if (source) g.index[p] = { hash: e.hash, mode: e.mode };
    sim.op('checkout', p + ' ← blob ' + short(e.hash), 'worktree', e.hash);
  }
  ctx.r.flow = source ? ['repo>idx', 'repo>wd'] : ['idx>wd-back'];
  ctx.r.explain = source ? 'git checkout <commit> -- <file> copied that file from the commit into BOTH the index and your working directory.' : 'git checkout -- <file> copied the staged version from the index over your working file. Unstaged edits are lost.';
  return '';
}

function doCheckout(sim, args, ctx, asSwitch) {
  const cmd = asSwitch ? 'switch' : 'checkout';
  const o = parseFlags(args, {
    flag: { '-b': 'b', '-B': 'B', '-c': 'c', '-C': 'C', '--detach': 'detach', '-d': 'detach', '-q': 'q', '-f': 'force', '--force': 'force', '--orphan': 'orphan', '--track': 'track' },
    val: {}

  const g = sim.git();
  let rest = o.rest.slice(); const after = o.after;
  let createName = null; let force = false;
  if (o.f.b || o.f.B || o.f.c || o.f.C) { createName = rest.shift(); force = !!(o.f.B || o.f.C); if (!createName) throw new GitError('fatal: switch \'' + (o.f.b ? 'b' : 'c') + '\' requires a value'); }

    const specs = after.length ? after : rest.slice(src ? 1 : 0);
    if (!specs.length) throw new GitError('fatal: invalid reference: ' + (rest[0] || ''));
    return restorePaths(sim, src, specs, ctx);

    if (!validBranch(createName)) throw new GitError("fatal: '" + createName + "' is not a valid branch name");
    if (g.refs['refs/heads/' + createName] && !force) throw new GitError("fatal: a branch named '" + createName + "' already exists");
    const start = target ? sim.resolveCommit(target) : sim.headHash();
    if (!start) { // unborn branch: just rename HEAD
      g.head = { ref: 'refs/heads/' + createName };
      sim.op('write HEAD', '.git/HEAD ← ref: refs/heads/' + createName + ' (still no commits)', 'head');

    }
    g.refs['refs/heads/' + createName] = start;
    sim.op('update-ref', 'refs/heads/' + createName + ' → ' + short(start), 'ref', start);
    const carried = switchTo(sim, start, { ref: 'refs/heads/' + createName }, {}, ctx);
    ctx.r.flow = ['branch'];
    ctx.r.explain = 'git ' + cmd + ' ' + (asSwitch ? '-c' : '-b') + ' ' + createName + ' did two things: created the branch file (a copy of the current commit hash) and pointed HEAD at it. Your files did not change because both branches are on the same commit.';

}
G.checkout = (sim, args, ctx) => doCheckout(sim, args, ctx, false);
G.switch = (sim, args, ctx) => doCheckout(sim, args, ctx, true);

/* ---------------------------------------------------------------- merge */
function applyMergeResult(sim, oursFlat, result, conflicts) {
  const g = sim.git();
  const paths = new Set([...Object.keys(oursFlat), ...Object.keys(result)]);
  for (const p of paths) {
    const r = result[p], o = oursFlat[p];
    if (r) { if (!o || o.hash !== r.hash) { sim.s.fs[p] = sim.blobContent(r.hash); sim.op('checkout', p + ' updated by the merge (blob ' + short(r.hash) + ')', 'worktree', r.hash); } g.index[p] = { hash: r.hash, mode: r.mode }; }
    else if (o && !conflicts.some(c => c.path === p)) { delete sim.s.fs[p]; delete g.index[p]; sim.op('unlink', p + ' removed by the merge', 'worktree'); }
  }
}
G.merge = (sim, args, ctx) => {
  const o = parseFlags(args, { flag: { '--no-ff': 'noff', '--ff-only': 'ffonly', '--ff': 'ff', '--abort': 'abort', '--no-edit': 'noedit', '-q': 'q', '--squash': 'squash', '--continue': 'cont' }, val: { '-m': 'm', '--message': 'm' } }, 'merge');

      if (head[p]) { sim.s.fs[p] = sim.blobContent(head[p].hash); g.index[p] = { hash: head[p].hash, mode: head[p].mode }; }

  return (msgs.length ? msgs.join('\n') + '\n' : '') + "Merge made by the 'ort' strategy.\n" + (ch.length ? sim.diffStat(ch) + '\n' + sim.shortStat(ch) + (sim.summaryLines(ch).length ? '\n' + sim.summaryLines(ch).join('\n') : '') : '');
};

/* ---------------------------------------------------------------- tag, reflog, config, check-ignore */
G.tag = (sim, args, ctx) => {
  const o = parseFlags(args, { flag: { '-a': 'a', '-d': 'd', '-l': 'l', '--list': 'l', '-f': 'f' }, val: { '-m': 'm' } }, 'tag');

    ctx.r.explain = 'An annotated tag is the fourth kind of Git object: a message, a tagger and a pointer to a commit. The file in refs/tags/ points at the tag object.';
  } else {
    g.refs['refs/tags/' + name] = target;
    sim.op('update-ref', 'refs/tags/' + name + ' → ' + short(target), 'ref', target);
    ctx.r.explain = 'A lightweight tag is a branch that never moves: a file in .git/refs/tags/ holding a commit hash.';
  }

};
G.reflog = (sim, args, ctx) => {
  const g = sim.git();
  if (!g.reflog.length) return '';
  const lines = []; const total = g.reflog.length;
  [...g.reflog].reverse().forEach((r, i) => {
    lines.push(A.y + short(r.hash) + A.x + (i === 0 ? sim.decorString(r.hash) : '') + ' HEAD@{' + i + '}: ' + r.msg);
  });
  ctx.r.explain = 'The reflog records every place HEAD has been. Even after a bad reset, the old commit usually still exists and you can find its hash here. It only covers committed work.';
  return lines.join('\n');

const CHAPTERS = [
  { id: 'problem', title: 'The problem Git solves', lab: 'version', body: () => `
    <p>Every project starts as a folder of files. Then you change something and want to keep the old version as well, so you copy the folder. A week later you have <code>project_final</code>, <code>project_final2</code> and <code>project_final_REAL</code>, and nobody remembers which one has the fix from Tuesday.</p>
    <p>Git replaces that habit with a small database that sits next to your files. It remembers every saved state of the project, who saved it, when, and why. It costs almost nothing to keep.</p>
    <div data-mount="folders" class="widget"></div>
    <p>That lets you answer questions the copy-the-folder method cannot:</p>
    <ul class="qlist"><li>What exactly changed between yesterday and today?</li><li>Who changed this line, and what was the reason?</li><li>Can I go back to the version from before I broke it?</li><li>Can two people edit the same project at the same time without overwriting each other?</li></ul>
    <h3>Centralised and distributed</h3>
    <p>Older tools such as SVN keep the history on one server. You ask the server for a file, change it, and send it back. If the server is down, or you are on a train, you cannot see history or save a version. Git is <b>distributed</b>: every person's copy of the project contains the entire history. A server such as GitHub is just one more copy that people agree to share.</p>
    <div data-mount="distributed" class="widget"></div>
    ${callout('say', 'Say it like this', '<p><b>Git is not GitHub.</b> Git is the version-control tool that runs on your machine. GitHub is one website that hosts remote copies of Git repositories.</p>')}` },
  { id: 'places', title: 'Three places your files live', lab: 'add', body: () => `
    <p>Open the project folder and you see your files. Turn on hidden items and you also see a folder called <code>.git</code>. That one folder is the repository. Everything outside it is your working directory. Git moves content between three areas.</p>
    ${tbl(['Area', 'What it is', 'Who writes to it'], [['Working directory', 'Ordinary files on disk.', 'You, with an editor or the shell. Also ' + code('git restore') + ' and ' + code('git checkout') + '.'], ['Index (staging area)', 'A file, ' + code('.git/index') + ', listing the exact content of the next commit.', code('git add') + ', ' + code('git rm') + ', ' + code('git mv') + ', ' + code('git restore --staged') + ', ' + code('git reset')], ['Repository', 'Immutable objects in ' + code('.git/objects') + ', plus branch names in ' + code('.git/refs') + '.', code('git commit')]])}
    ${callout('say', 'Say it like this', '<p>Think of packing a parcel. The desk is your working directory, where things are messy and changing. The box on the table is the index: you decide what goes in it. Sealing the box and writing it into the delivery log is the commit. You cannot change a sealed box, you can only pack a new one.</p>')}
    <div data-mount="story:areas" class="widget"></div>
    <h3>Why a staging step at all?</h3>
    <p>It lets you choose which of your changes belong together in a commit. You may have edited five files but fixed two separate bugs. Stage the files for bug one, commit, then stage the rest for bug two.</p>
    <h3>Which command moves data where</h3>
    ${tbl(['Command', 'Effect'], [[code('git add <path>'), 'working directory → index'], [code('git commit'), 'index → new commit in the repository; the branch moves forward'], [code('git commit -a'), 'tracked changes in the working directory → index → commit (skips untracked files)'], [code('git restore --staged <path>'), 'last commit → index (un-stage; the working file is untouched)'], [code('git restore <path>'), 'index → working directory (throws away unstaged edits)'], [code('git restore --source=<rev> <path>'), 'any commit → working directory'], [code('git rm <path>'), 'deletes from the working directory and the index'], [code('git rm --cached <path>'), 'deletes from the index only; the file stays on disk (stops tracking)'], [code('git mv <a> <b>'), 'renames in the working directory and the index in one step'], [code('git reset'), 'last commit → index, for every path'], [code('git clean -f'), 'deletes untracked files from the working directory']])}` },
  { id: 'dotgit', title: 'Inside the .git folder', lab: 'init', body: () => `
    <p>Run <code>git init</code> in an empty folder and Git creates a small set of files and folders. The story below opens it up step by step. Click anything in the tree to read it.</p>
    <div data-mount="story:inside" class="widget"></div>
    ${tbl(['Entry', 'What it holds', 'Read it with'], [[code('HEAD'), 'The current branch, for example ' + code('ref: refs/heads/main'), code('cat .git/HEAD')], [code('config'), 'Per-repo settings: name, email, remotes, line-ending rules', code('git config --list --local')], [code('index'), 'The staging area (binary)', code('git ls-files -s')], [code('objects/'), 'Every file version, folder listing and commit ever saved', code('git cat-file -p <hash>')], [code('refs/heads/'), 'One tiny file per branch, containing a commit hash', code('cat .git/refs/heads/main')], [code('logs/'), 'The reflog: where HEAD and branches have been', code('git reflog')], [code('COMMIT_EDITMSG'), 'The last message typed in the editor', code('cat .git/COMMIT_EDITMSG')], [code('info/exclude'), 'Ignore rules that are private to your clone', code('cat .git/info/exclude')]])}
    ${callout('watch', 'Watch out', '<p>Never delete or hand-edit the <code>.git</code> folder to "tidy up". Delete it and you delete the whole history of the project, leaving only the current files. Copying a folder that contains <code>.git</code> copies the history with it.</p><p>In the lab you can see this for yourself: run <code>rm -rf .git</code>, watch the three places empty out, then press Reset lab.</p>')}` },
  { id: 'objects', title: 'Objects: blobs, trees and commits', lab: 'inside', body: () => `
    <p>Git is, at its core, a key-value store. The key is a hash, the value is some content. There are only four kinds of value.</p>
    ${tbl(['Object', 'Stores', 'Roughly like'], [['blob', 'The bytes of one file. No file name, no date, nothing else.', 'the contents of a file'], ['tree', 'A folder listing: for each entry a mode, a type, a hash and a name.', 'a directory'], ['commit', 'One tree hash, parent commit hash(es), author, committer, message.', 'a labelled snapshot'], ['tag', 'A named, optionally signed pointer to another object (often a commit).', 'a sticky note on a release']])}
    <h3>How an object gets its name</h3>
    <p>Git builds a small header (the word <code>blob</code>, a space, the length in bytes and a zero byte), puts the content after it, and runs SHA-1 over the whole thing. That 40-character result is the name. You can reproduce it by hand, and the lab terminal gives the same answers as real Git:</p>
    <pre class="codeblock">$ printf 'Hello from Git\\n' | git hash-object --stdin
c14b6d18d9d1897ba54dbe203cbc1583427ec0a1

$ printf 'blob 15\\0Hello from Git\\n' | sha1sum
c14b6d18d9d1897ba54dbe203cbc1583427ec0a1  -</pre>
    <div data-mount="hash" class="widget"></div>
    <p>Three practical consequences follow from "the name is the hash of the content":</p>
    <ul class="qlist"><li><b>Identical content is stored once.</b> Two files with the same text share one blob.</li><li><b>Objects never change.</b> If the content changes, the hash changes, so it is a new object. Old objects stay exactly as they were.</li><li><b>The hash is also a checksum.</b> If a disk error flips one bit in an object, its content no longer matches its name, and Git can tell.</li></ul>
    <h3>Commits, trees and blobs together</h3>
    <p>A commit does not contain files. It points at a tree, the top-level folder, and the tree points at blobs and at sub-trees. Step through it:</p>
    <div data-mount="story:objects" class="widget"></div>
    ${callout('say', 'Say it like this', '<p>A commit is a photograph of the whole folder, not a list of edits. A photograph that shares most of its pixels with the previous one. If a file did not change, the new photograph just points at the old file.</p>')}
    <h3>Snapshots, not diffs</h3>
    <p>Many people picture a Git history as a stack of patches. Internally it is not. Every commit points at a complete tree. When you run <code>git diff</code> or <code>git show</code>, Git takes the two trees you asked about and compares them at that moment. Differences are computed, never stored.</p>
    <p>The same is true for renames. Git has no "rename" record. When it compares an old tree and a new tree, it notices that one blob disappeared under one name and appeared under another, and judges the contents 100% similar. The default threshold is 50%.</p>
    <p>A commit's own hash is computed from all its lines, including the parent's hash. So changing an old commit changes its hash, which changes every later commit's hash too. That is why history in Git cannot be altered quietly.</p>` },
  { id: 'branches', title: 'Branches, HEAD and finding things', lab: 'branch', body: () => `
    <p>Hashes are hard to remember, so Git has names for them. A branch is the simplest possible name: a text file holding one commit hash. <code>HEAD</code> normally contains the name of a branch, not a hash, which is how Git knows which branch to move when you commit.</p>
    <div data-mount="story:branches" class="widget"></div>
    <p>Creating a branch costs one 41-byte file, which is why people make them freely. When you commit, Git writes the new commit and then changes that one file so it holds the new hash. That is all "the branch moves forward" means.</p>
    <h3>Ways to name a commit</h3>
    ${tbl(['Written as', 'Means', 'Example'], [[code('6e70d24'), 'A unique prefix of the hash. Four characters work if unambiguous.', code('git show 6e70')], [code('HEAD'), 'The commit your current branch points to.', code('git log')], [code('HEAD~1'), 'The parent of HEAD. ' + code('HEAD~2') + ' is the grandparent.', code('git ls-tree HEAD~1')], [code('main'), 'The commit that branch points to.', code('git log main')], [code('HEAD~1:style.css'), 'The file as it was in that commit. The form is ' + code('commit:path') + ', with no spaces.', code('git show HEAD~1:style.css')]])}
    ${callout('say', 'Say it like this', '<p>A <b>detached HEAD</b> is the case where HEAD holds a raw hash instead of a branch name, for example after checking out an old commit to look around. It is not an error. It only means new commits will not be reachable from a branch name unless you create one.</p>')}
    <h3>Fast-forward or merge commit</h3>
    <p>If the branch you are on has no new commits of its own, merging just slides its label forward (a <b>fast-forward</b>). If both branches have new work, Git writes a <b>merge commit</b> with two parents. If both changed the same lines, you get a <b>conflict</b> to resolve by hand. The Lab has an optional step for each.</p>` },
  { id: 'undo', title: 'Taking things back', lab: 'undo', body: () => `
    <p>Git has several undo commands and they are not equally safe. The story shows the difference between the two groups.</p>
    <div data-mount="story:undo" class="widget"></div>
    ${tbl(['Command', 'Changes the index?', 'Changes your files?', 'Reversible?'], GS.undoTable.map(r => [code(r.cmd), esc(r.index), esc(r.files), esc(r.rev)]), 'undo')}
    ${callout('say', 'Say it like this', '<p>Two groups. The first group, <code>restore --staged</code> and <code>reset</code>, only touches the index, so nothing is lost. The second group, <code>restore</code> and <code>clean</code>, touches your real files, so ask yourself whether Git has a copy before you press Enter.</p>')}
    ${callout('watch', 'Watch out', '<p>The safety net only covers things that were committed. Edits that never reached a commit are not in the object database. <code>git restore</code> on a modified file and <code>git clean -f</code> on an untracked file delete work that Git has no copy of. Both are permanent. Run <code>git clean -nd</code> first: <code>-n</code> is a dry run.</p>')}
    <p>For committed work the reflog is the net: <code>git reflog</code> lists every place HEAD has been, so even after a bad reset the old commit can usually be found.</p>` },
  { id: 'ignore', title: 'Ignoring files, and the tracked-file trap', lab: 'status', body: () => `
    <p>A <code>.gitignore</code> file lists things Git should not start watching. It cannot make Git stop watching something it already watches. For that you need <code>git rm --cached</code>.</p>
    <div data-mount="story:ignore" class="widget"></div>
    ${tbl(['Pattern', 'Matches'], [[code('logs/'), 'A directory named logs, anywhere in the project.'], [code('/logs/'), 'Only the logs directory at the top, next to .gitignore.'], [code('*.log'), 'Any file ending in .log, at any depth.'], [code('/main.log'), 'Only main.log in the top folder.'], [code('!keep.log'), 'Exception: do not ignore this file even if another rule would.'], [code('# note'), 'A comment line.']])}
    <p>The leading slash anchors the pattern to the top folder; the trailing slash means folders only. To see why a path is (or is not) ignored, ask Git: ${code('git check-ignore -v <path>')} prints <code>file:line:pattern</code>, and <code>--no-index</code> asks the question while ignoring that the file is already tracked.</p>
    ${callout('watch', 'Watch out', '<p>Untracking does not erase history. If a file held a password or a key, removing it from the next commit does not make it safe: the secret is still inside the earlier commits. Change the secret. This is the best argument for writing <code>.gitignore</code> <b>before</b> the first <code>git add .</code></p>')}` },
  { id: 'remotes', title: 'Where remotes fit', lab: null, body: () => `
    <p>Everything in the lab happens on one computer. No <code>remote</code>, <code>push</code> or <code>pull</code> is needed to learn how Git works. For completeness, here is where a server such as GitHub fits in. A remote is another repository with the same structure.</p>
    <div class="remote-fig" role="img" aria-label="Diagram: your computer has a working directory, index and local repository; push and fetch connect the local repository to a remote repository on a server">
      <div class="rf-box you"><span>Your computer</span><div class="rf-row"><i class="wd">Working directory</i><i class="idx">Index</i><i class="repo">Local repo<br><small>.git</small></i></div></div>
      <div class="rf-mid"><span>git push →</span><span>← git fetch</span><small>pull = fetch + merge</small></div>
      <div class="rf-box srv"><span>Remote</span><div class="rf-row"><i class="repo">Remote repo<br><small>e.g. on GitHub</small></i></div></div>
    </div>
    <ul class="qlist"><li><b>clone</b> copies a remote repository, whole history included, to your machine.</li><li><b>push</b> uploads the objects the remote is missing and moves a branch name over there.</li><li><b>fetch</b> downloads new objects and updates your record of the remote's branches, without touching your files.</li><li><b>pull</b> is a fetch followed by a merge into your current branch.</li></ul>
    <p>Because each copy is complete, everyday work (commit, log, diff, branch) is fast and needs no network. Only the sharing steps do. That is the design bargain: safety (immutable, content-named objects), speed (nearly everything is a local file read), cheap branching, and a safety net in the reflog.</p>` }
];

function mountWidget(m, app) {

function distributedWidget(m) {

    m.innerHTML = `<div class="wd-bar"><button type="button" class="btn ${down ? '' : 'warn'}" data-down>${down ? 'Bring the server back' : 'The server goes down'}</button></div>

      <div class="wd-col"><h5>Distributed (Git)</h5><div class="wd-net"><div class="node srv ${down ? 'dead' : ''}">GitHub<small>one more copy</small></div><div class="clients"><div class="node cli full">you<small>full history</small></div><div class="node cli full">teammate<small>full history</small></div></div></div>

  };
  draw();
}

    const filesN = wd.filter(r => r.st !== 'ignored' && r.st !== 'deleted').length;
    this.q('[data-f="wd"]').textContent = filesN + (filesN === 1 ? ' file' : ' files') + (snap.counts && snap.counts.ignored ? ' + ' + snap.counts.ignored + ' ignored' : '');

    else {

      for (const r of snap.index || []) { const [tag, cls] = TG[r.tag || ''] || ['', 'same']; h += this.row({ p: r.p, name: r.tag === 'renamed' && r.from ? r.from + ' → ' + r.p : r.p, h: r.h, tag, cls, key: r.p + ':' + r.tag + ':' + r.h, st: r.tag }, fi, 'idx'); }

    this.q('[data-r="idx"]').innerHTML = h; fi.end();
    this.q('[data-f="idx"]').textContent = snap.repo ? (snap.index || []).filter(r => r.tag !== 'deleted').length + ' entries' : '';
    // repository
    const fr = this.f.repo; fr.begin(); h = '';

    else if (!snap.head.hash) h = `<li class="empty">No commits yet.<br><code>HEAD</code> points at <code>${esc(snap.head.ref || '')}</code>, which does not exist until the first commit.</li>`;

}

/* ================================================================== connection to the helper */
class HelperClient {
  constructor(o) { this.base = (o.base || '').replace(/\/$/, ''); this.token = o.token || ''; this.es = null; this.onState = () => {}; this.onStatus = () => {}; }
  headers() { return { 'X-Git-Live-Token': this.token, 'Content-Type': 'application/json' }; }
  async ping() {
    try { const r = await fetch(this.base + '/api/ping', { cache: 'no-store' }); const j = await r.json(); return !!(j && j.app === 'git-watch'); } catch (e) { return false; }
  }
  async checkToken() {
    try { const r = await fetch(this.base + '/api/state', { headers: this.headers(), cache: 'no-store' }); if (r.status === 401) return { ok: false, error: 'That pairing code is not right. Copy it from the cmd window.' }; const j = await r.json(); return { ok: true, folder: j.folder, snapshot: j.snapshot }; } catch (e) { return { ok: false, error: 'Could not reach the helper.' }; }
  }
  async watch(path) {
    try { const r = await fetch(this.base + '/api/watch', { method: 'POST', headers: this.headers(), body: JSON.stringify({ path }) }); return await r.json(); } catch (e) { return { ok: false, error: 'Could not reach the helper.' }; }
  }
  async get(p, params) {
    const q = new URLSearchParams(params || {}).toString();
    try { const r = await fetch(this.base + p + (q ? '?' + q : ''), { headers: this.headers(), cache: 'no-store' }); return await r.json(); } catch (e) { return { ok: false, error: 'The helper stopped answering.' }; }
  }
  open() {
    this.close();
    const es = this.es = new EventSource(this.base + '/api/events?token=' + encodeURIComponent(this.token));
    es.addEventListener('state', ev => { try { this.onState(JSON.parse(ev.data)); } catch (e) { /* ignore a partial event */ } });
    es.onopen = () => this.onStatus('live');
    es.onerror = () => this.onStatus('lost');
  }
  close() { if (this.es) { this.es.close(); this.es = null; } }
}
